<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CD5C4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#logoGrad)" />
  
  <!-- Stylized Wallet & Growth Graph Emblem -->
  <rect x="24" y="32" width="52" height="38" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="5" />
  <path d="M 24 45 L 76 45" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" />
  
  <!-- Wallet Clasp / Coin -->
  <circle cx="62" cy="51" r="5" fill="#ffffff" />
  <circle cx="62" cy="51" r="2.5" fill="#0f172a" />
  
  <!-- Trending Up Arrow inside Wallet -->
  <path d="M 32 58 L 44 46 L 52 52 L 64 38" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="64,38 56,38 64,46" fill="#38bdf8" />
</svg>
